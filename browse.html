<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse cars — CarWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow eyebrow--light">Every option, one view</p>
      <h1>Browse the full lineup.</h1>
      <p>Search, filter by body type or powertrain, and sort by what matters to you. Add up to three cars to compare side by side.</p>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container">
      <div class="cw-quick-chips" id="browse-quick-chips">
        <button class="cw-quick-chip is-active" type="button" data-filter="all">All Vehicles (9)</button>
        <button class="cw-quick-chip" type="button" data-filter="electric">⚡ 100% Electric (3)</button>
        <button class="cw-quick-chip" type="button" data-filter="hybrid">🔋 Smart Hybrid (3)</button>
        <button class="cw-quick-chip" type="button" data-filter="petrol">⛽ Petrol Power (3)</button>
        <button class="cw-quick-chip" type="button" data-filter="safety">⭐ 5-Star Safety</button>
        <button class="cw-quick-chip" type="button" data-filter="budget">💰 Under ₹30 Lakh</button>
      </div>

      <div class="filter-bar">
        <div class="filter-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input type="text" id="search" placeholder="Search make, model, or what it's good for">
        </div>
        <select id="filter-body"><option value="">All body types</option></select>
        <select id="filter-power"><option value="">All powertrains</option></select>
        <select id="sort-by">
          <option value="recommended">Recommended</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="safety-desc">Safety rating</option>
          <option value="name-asc">Name: A–Z</option>
        </select>
        <button class="btn--link" id="reset-filters" type="button">Reset</button>
      </div>

      <p class="filter-count"><strong id="result-count">0</strong> matches · <span id="persona-note"></span></p>
      <div class="car-grid" id="browse-grid"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=3"></script>
<script src="js/cars-data.js?v=3"></script>
<script src="js/app.js?v=3"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="js/payment-simulator.js?v=4"></script>
<script src="js/bookings-orders.js?v=4"></script>
<script src="js/ai-chat.js?v=4"></script>
<script src="js/browse.js?v=3"></script>
</body>
</html>
